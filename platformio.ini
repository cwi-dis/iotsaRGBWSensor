; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = .
default_envs = lolin32_lite
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
    https://github.com/cwi-dis/iotsa.git#develop
    VEML6040
monitor_speed = 115200
build_flags = -DIOTSA_WITH_BLE -DIOTSA_VEML_SDA=19 -DIOTSA_VEML_SCL=23

; The only build target: the battery-powered VEML6040 sensor is a LOLIN32 Lite
; (one at work, one at Tuinpark Lissabon). min_spiffs comes from the vendored
; [lolin32] board-def -- the BLE build needs the app space and this device keeps
; nothing in LittleFS but a tiny config file.
[env:lolin32_lite]
extends = lolin32
